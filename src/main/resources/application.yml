spring:
  application:
    name: yedige-batyrkhan-student-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_api}
    username: ${DB_USER:student_api}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
