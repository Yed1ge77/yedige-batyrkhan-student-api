name: yedige-batyrkhan-student-api
services:
  app:
    image: yedige-batyrkhan-student-api:v1.0-yedige-batyrkhan
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/student_api
      DB_USER: ${DB_USER:-student_api}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [student-network]
    restart: unless-stopped
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: student_api
      POSTGRES_USER: ${DB_USER:-student_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - student-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [student-network]
    restart: unless-stopped
volumes:
  student-data:
networks:
  student-network:
